; ============================================================================
; EE4552 - Multi-Hop Cluster-Tree WSN (Temperature & Humidity Monitoring)
; PlatformIO Configuration for 4 Hardware Nodes + MAC Reader Utility
; Hardware (BOM v2):
;   - Node 1, Node 2, Node 3 : ESP32-C3 Super Mini + SHT30 (I2C GPIO4/5)
;   - Gateway (Sink)         : ESP32-WROOM-32 / 32U (Dual-Core)
; ============================================================================

[platformio]
default_envs = gateway

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=0

; Common configuration for ESP32-C3 Super Mini nodes
[esp32c3_base]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ----------------------------------------------------------------------------
; 1. Node 1 - Remote Leaf (2-hop: N1 -> N2 -> GW, Deep Sleep, Auto-Reroute)
; ----------------------------------------------------------------------------
[env:node1_leaf]
extends = esp32c3_base
build_src_filter = +<main_leaf.cpp>
build_flags =
    ${esp32c3_base.build_flags}
    -D NODE_ID=1
    -D DEFAULT_NEXT_HOP_ID=2
    -D ENABLE_AUTO_REROUTE=1

; ----------------------------------------------------------------------------
; 2. Node 2 - Sensor + Relay (Always-On RX, 1-hop self + 2-way forwarding)
; ----------------------------------------------------------------------------
[env:node2_relay]
extends = esp32c3_base
build_src_filter = +<main_relay.cpp>
build_flags =
    ${esp32c3_base.build_flags}
    -D NODE_ID=2
    -D IS_RELAY=1

; ----------------------------------------------------------------------------
; 3. Node 3 - Local Leaf (1-hop reference: N3 -> GW, Deep Sleep)
; ----------------------------------------------------------------------------
[env:node3_leaf]
extends = esp32c3_base
build_src_filter = +<main_leaf.cpp>
build_flags =
    ${esp32c3_base.build_flags}
    -D NODE_ID=3
    -D DEFAULT_NEXT_HOP_ID=0
    -D ENABLE_AUTO_REROUTE=0

; ----------------------------------------------------------------------------
; 4. Gateway - Sink Node (ESP32-WROOM-32 Dual-Core, APP_ACK, CSV Serial)
; ----------------------------------------------------------------------------
[env:gateway]
board = esp32dev
build_src_filter = +<main_gateway.cpp>
build_flags =
    ${env.build_flags}
    -D NODE_ID=0
    -D IS_GATEWAY=1

; ----------------------------------------------------------------------------
; 5. Utility: Read hardware Wi-Fi MAC address (run once per board)
; ----------------------------------------------------------------------------
[env:mac_reader_c3]
extends = esp32c3_base
build_src_filter = +<main_mac_reader.cpp>

[env:mac_reader_gw]
board = esp32dev
build_src_filter = +<main_mac_reader.cpp>

; ----------------------------------------------------------------------------
; 6. Utility: Hardware Bring-Up Test (Blink LED + I2C Scan + SHT30)
; ----------------------------------------------------------------------------
[env:test_hw_c3]
extends = esp32c3_base
build_src_filter = +<main_test_hw.cpp>
build_flags =
    ${esp32c3_base.build_flags}
    -D ONBOARD_LED_PIN=8
    -D LED_ACTIVE_LOW=1
    -D TEST_I2C_SDA=4
    -D TEST_I2C_SCL=5

[env:test_hw_gw]
board = esp32dev
build_src_filter = +<main_test_hw.cpp>
build_flags =
    ${env.build_flags}
    -D ONBOARD_LED_PIN=23
    -D LED_ACTIVE_LOW=0
    -D TEST_I2C_SDA=21
    -D TEST_I2C_SCL=22
NTN 